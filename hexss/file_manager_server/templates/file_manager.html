<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="navbar">
    <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h18v18H3zM9 3v18"/>
        </svg>
        <h2>File Explorer</h2>
    </div>
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
</header>

<div class="toolbar" id="toolbar">
    <form id="upload-form" onsubmit="return false">
        <input type="file" id="file-upload" class="hidden-input" multiple>
        <input type="file" id="folder-upload" class="hidden-input" webkitdirectory directory multiple>

        <button type="button" class="btn btn-primary" onclick="document.getElementById('file-upload').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            Upload File
        </button>

        <button type="button" class="btn btn-primary" onclick="document.getElementById('folder-upload').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            Upload Folder
        </button>

        <button type="button" id="create-file-btn" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            New File
        </button>
        <button type="button" id="create-folder-btn" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            New Folder
        </button>
    </form>

    <div id="upload-progress" class="upload-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="upload-progress-track"><div class="upload-progress-bar"></div></div>
        <span class="upload-progress-label"></span>
    </div>
</div>

<div class="main-content">
    <div class="file-list-container">
        <div class="file-list-header">
            <div class="col-name">Name</div>
            <div class="col-type">Type</div>
            <div class="col-size">Size</div>
        </div>
        <div class="file-list-body" id="file-list-body"></div>
    </div>
</div>

<div id="context-menu" class="context-menu">
    <ul>
        <li id="download-option">Download</li>
        <li id="rename-option">Rename</li>
        <li id="edit-option">Edit</li>
        <li id="extract-option">Extract</li>
        <li class="danger" id="delete-option">Delete</li>
    </ul>
</div>

<div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="edit-title">Edit File</h3>
            <span class="close-btn" id="cancel-edit-x" title="Close (Esc)">&times;</span>
        </div>
        <div class="modal-body">
            <input type="text" id="file-name" placeholder="Filename (e.g. script.py)" autocomplete="off">
            <textarea id="edit-content" placeholder="Type your code here..." spellcheck="false"></textarea>
            <small class="modal-hint">Ctrl+S to save &middot; changing the file name saves a copy under the new name</small>
        </div>
        <div class="modal-footer">
            <button id="cancel-edit" class="btn btn-outline">Cancel</button>
            <button id="save-edit" class="btn btn-primary">Save Changes</button>
        </div>
    </div>
</div>

<script src="/static/jquery-3.6.0.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
