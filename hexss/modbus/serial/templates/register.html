<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Register Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f7f7f7;
        }
        .register-table th, .register-table td {
            text-align: center;
            vertical-align: middle;
        }
        .register-section {
            margin-bottom: 2rem;
        }
        .address-text {
            font-size: 0.95em;
            color: #888;
        }
        .tg { border-collapse: collapse; width: 100%; }
        .tg th, .tg td { border: 1px solid #ccc; text-align: center; padding: 0.25em; }
        .tg th { background: #f8f9fa; font-size: 0.95em; }
        .tg .green { background: #d4edda; color: #155724; font-weight: bold; }
        .tg .red { background: #f8d7da; color: #721c24; }
        .tg .gray { background: #e9ecef; color: #888; }
    </style>
</head>
<body>
{% include "header.html" %}
<div class="container my-4">
    <h1 class="mb-4">Robot Register Monitor</h1>
    <div class="mb-3">
        <label for="slaveSelect" class="form-label">Select Slave:</label>
        <select id="slaveSelect" class="form-select" style="width: auto; display: inline-block;">
            {% for i in range(num_slaves) %}
            <option value="{{ i }}">Slave {{ i }}</option>
            {% endfor %}
        </select>
        <span id="connectionStatus" class="ms-3 badge bg-secondary">Connecting...</span>
    </div>
    <div id="registerDisplay">
        <div class="alert alert-info">Loading register data...</div>
    </div>
</div>

<style>
    /* ... existing styles ... */
    .tg .clickable-bit {
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .tg .clickable-bit:hover {
        opacity: 0.7;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }
</style>

<script>
     function writeRegister(slaveId, symbol, inputId) {
        const input = document.getElementById(inputId);
        const value = input.value;

        if (value === "") {
            alert("Please enter a value");
            return;
        }

        const payload = {
            slave: parseInt(slaveId),
            register: symbol,
            value: value // Backend handles hex string or int string conversion
        };

        fetch('/api/register/write', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(json => {
            if (json.status === 'success') {
                console.log(`Success: ${json.message}`);
                // Optional: visual feedback or clear input
                input.style.borderColor = "green";
                setTimeout(() => input.style.borderColor = "", 1000);
            } else {
                alert(`Error: ${json.message}`);
            }
        })
        .catch(err => {
            console.error('Network error:', err);
            alert('Network error');
        });
    }

    function toggleBit(slaveId, symbol, bit, currentValue) {
        const newValue = currentValue === 1 ? false : true;

        const payload = {
            slave: parseInt(slaveId),
            register: symbol,
            bit: parseInt(bit),
            value: newValue
        };

        fetch('/api/register/write_bit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(json => {
            if (json.status !== 'success') {
                alert(`Error: ${json.message}`);
            }
            // ไม่ต้องทำอะไรเพิ่ม ถ้าสำเร็จ เดี๋ยว SSE จะส่งค่าใหม่กลับมาอัปเดตสีเอง
        })
        .catch(err => {
            console.error('Network error:', err);
        });
    }

    function renderBitfieldTable(reg, slaveId) { // รับ slaveId เพิ่ม
        let bits = [];
        let maxBit = 15;
        for (let i = maxBit; i >= 0; i--) {
            let sig = null;
            if (reg.signals && reg.signals.hasOwnProperty(String(i))) {
                sig = reg.signals[String(i)];
            }
            bits.push({
                bit: i,
                symbol: sig ? sig.symbol : "-",
                value: sig ? sig.value : null
            });
        }
        let ths = bits.map(b => `<th>${b.bit}</th>`).join('');
        let trs = bits.map(b => `<td>${b.symbol}</td>`).join('');
        let vals = bits.map(b => {
            let cellClass = "gray";
            let displayVal = "-";
            let clickAction = "";

            if (b.value === 1) {
                cellClass = "green clickable-bit";
                displayVal = "1";
                clickAction = `onclick="toggleBit('${slaveId}', '${reg.symbol}', ${b.bit}, 1)"`;
            } else if (b.value === 0) {
                cellClass = "red clickable-bit";
                displayVal = "0";
                clickAction = `onclick="toggleBit('${slaveId}', '${reg.symbol}', ${b.bit}, 0)"`;
            }

            return `<td class="${cellClass}" ${clickAction}>${displayVal}</td>`;
        }).join('');

        return `
        <div class="pt-2">
          <table class="tg">
            <thead><tr>${ths}</tr></thead>
            <tbody>
              <tr>${trs}</tr>
              <tr>${vals}</tr>
            </tbody>
          </table>
        </div>
        `;
    }

    function renderMultiWordBitfieldTable(reg, slaveId) { // รับ slaveId เพิ่ม
        function makeTable(startBit, endBit) {
            let bits = [];
            for (let i = startBit; i >= endBit; i--) {
                let sig = reg.signals && reg.signals.hasOwnProperty(String(i)) ? reg.signals[String(i)] : null;
                bits.push({
                    bit: i,
                    symbol: sig ? sig.symbol : "-",
                    value: sig ? sig.value : null
                });
            }
            let ths = bits.map(b => `<th>${b.bit}</th>`).join('');
            let trs = bits.map(b => `<td>${b.symbol}</td>`).join('');
            let vals = bits.map(b => {
                let cellClass = "gray";
                let displayVal = "-";
                let clickAction = "";

                if (b.value === 1) {
                    cellClass = "green clickable-bit";
                    displayVal = "1";
                    clickAction = `onclick="toggleBit('${slaveId}', '${reg.symbol}', ${b.bit}, 1)"`;
                } else if (b.value === 0) {
                    cellClass = "red clickable-bit";
                    displayVal = "0";
                    clickAction = `onclick="toggleBit('${slaveId}', '${reg.symbol}', ${b.bit}, 0)"`;
                }

                return `<td class="${cellClass}" ${clickAction}>${displayVal}</td>`;
            }).join('');
            return `
            <div class="pt-2">
              <table class="tg">
                <thead><tr>${ths}</tr></thead>
                <tbody>
                  <tr>${trs}</tr>
                  <tr>${vals}</tr>
                </tbody>
              </table>
            </div>
            `;
        }
        return makeTable(31, 16) + makeTable(15, 0);
    }

    function registerTable(registers) {
        let html = "";
        let slaveSelect = document.getElementById('slaveSelect');
        let currentSlave = slaveSelect.value;

        for (const [symbol, reg] of Object.entries(registers)) {
            let inputId = `input-${symbol}`;

            html += `<div class="register-section card mb-3">
                        <div class="card-header register-title d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${reg.symbol} - ${reg.name}</strong>
                                <span class="address-text ms-2">(Address: ${reg.address.map(a => "0x" + a.toString(16).padStart(4, "0")).join(", ")})</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="d-flex align-items-center flex-wrap gap-3 mb-2">
                                <div>
                                    <strong>Value:</strong> <span class="badge bg-dark fs-6">${reg.val !== null ? reg.val : "N/A"}</span>
                                </div>
                                <div class="input-group input-group-sm" style="width: 250px;">
                                    <input type="text" class="form-control" id="${inputId}" placeholder="New Value (Dec/Hex)">
                                    <button class="btn btn-outline-primary" type="button" onclick="writeRegister('${currentSlave}', '${reg.symbol}', '${inputId}')">Write</button>
                                </div>
                            </div>`;

            if (
                reg.signals &&
                Object.keys(reg.signals).length > 0 &&
                reg.address.length === 2 &&
                Math.max(...Object.keys(reg.signals).map(Number)) >= 16
            ) {
                html += renderMultiWordBitfieldTable(reg, currentSlave);
            }
            else if (reg.signals && Object.keys(reg.signals).length > 0) {
                html += renderBitfieldTable(reg, currentSlave);
            }

            html += `</div></div>`;
        }
        return html;
    }

    let eventSource = null;
    let lastData = null;

    function updateDisplay(data) {
        let slaveSelect = document.getElementById('slaveSelect');
        let slaveKey = "Slave " + slaveSelect.value;
        let regData = data[slaveKey];
        if (!regData) {
            document.getElementById('registerDisplay').innerHTML = `<div class="alert alert-warning">No data for ${slaveKey}</div>`;
            return;
        }
        document.getElementById('registerDisplay').innerHTML = registerTable(regData);
    }

    function connectEventSource() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        lastData = null;
        const slave = document.getElementById('slaveSelect').value;
        document.getElementById('connectionStatus').textContent = "Connecting...";
        document.getElementById('connectionStatus').className = "ms-3 badge bg-secondary";
        document.getElementById('registerDisplay').innerHTML = `<div class="alert alert-info">Loading register data...</div>`;

        eventSource = new EventSource(`/api/socket/register?slave=${slave}`);
        eventSource.onopen = function() {
            document.getElementById('connectionStatus').textContent = "Connected";
            document.getElementById('connectionStatus').className = "ms-3 badge bg-success";
        };
        eventSource.onerror = function() {
            document.getElementById('connectionStatus').textContent = "Disconnected";
            document.getElementById('connectionStatus').className = "ms-3 badge bg-danger";
        };
        eventSource.onmessage = function(e) {
            try {
                if (e.data && e.data !== lastData) {
                    lastData = e.data;
                    let data = JSON.parse(e.data);
                    updateDisplay(data);
                }
            } catch (ex) {
                // console.error(ex);
            }
        };
    }

    document.getElementById('slaveSelect').addEventListener('change', function() {
        connectEventSource();
    });

    // Initial load
    connectEventSource();
</script>
</body>
</html>
